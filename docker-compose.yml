services:
  horizon-scan:
    build: .
    env_file:
      - .env
    ports:
      # Port mapping works because BIND_HOST=0.0.0.0 is set above.
      # The application defaults to 127.0.0.1 (loopback) without it.
      - "3001:3001"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - horizon-scan-data:/app/data
    environment:
      - DATABASE_URL=/app/data/horizon-scan.db
      - CONFIG_PATH=/app/config.yaml
      - PORT=3001
      - LOG_LEVEL=info
      # Bind host — explicitly set to 0.0.0.0 for Docker port mapping.
      # The application defaults to 127.0.0.1 (loopback); this override
      # makes the service reachable from outside the container.
      - BIND_HOST=0.0.0.0
      # Authentication — uncomment and set to require API key for mutations:
      # - API_KEY=your-secret-key-here
      # LLM provider keys — uncomment and set as needed:
      # - ANTHROPIC_API_KEY=
      # - OPENAI_API_KEY=
      # - GEMINI_API_KEY=
      # - OLLAMA_BASE_URL=http://host.docker.internal:11434
      # - LMSTUDIO_BASE_URL=http://host.docker.internal:1234/v1
      # Email delivery:
      # - MAILGUN_API_KEY=
      # - MAILGUN_DOMAIN=
    restart: unless-stopped

volumes:
  horizon-scan-data:
